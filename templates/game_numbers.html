{% extends "base.html" %}
{% block content %}<div class="game-shell cognitive-game game-numbers"><div class="game-topbar"><a href="{{url_for('patient_dashboard')}}" class="back-btn">← Back</a><h1>{{lang.numbers_game}}</h1><div class="level-badge">Level {{level}}</div></div><div class="game-intro"><span class="game-domain">🔢 NUMERACY</span><p>Tap the numbers from smallest to largest.</p></div><div class="contrast-note"><span class="contrast-dot"></span>Strong borders make the number targets easier to locate and track.</div><div id="number-board" class="number-board"></div><div id="progress" class="quiz-progress"></div><div id="result-panel" class="result-panel hidden"><h2 id="result-title"></h2><p id="result-detail"></p><a href="{{url_for('patient_dashboard')}}" class="big-btn primary">Back to Home</a><div id="next-countdown" class="next-countdown"></div></div></div>{% endblock %}
{% block scripts %}<script>
const LEVEL={{level}},LANG_CODE='{{patient.language}}',WELL_DONE='{{lang.well_done}}',TRY_AGAIN='{{lang.try_again}}';const n=Math.min(12,4+LEVEL*2);let nums=Array.from({length:n},(_,i)=>i+1).sort(()=>Math.random()-.5),next=1,wrong=0,st=Date.now();document.getElementById('progress').innerText=`Find 1 through ${n}`;let board=document.getElementById('number-board');nums.forEach(v=>{let b=document.createElement('button');b.className='number-tile';b.innerText=v;b.onclick=()=>{if(v===next){b.classList.add('chosen');b.disabled=true;next++;if(next>n)finish()}else{wrong++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300)}};board.appendChild(b)});async function finish(){let elapsed=Date.now()-st,a=Math.max(.25,1-(wrong/Math.max(1,n))),avg=Math.round(elapsed/n),r=await submitScore({game_type:'numbers',accuracy:a,avg_time_ms:avg,score:Math.round(a*100),level:LEVEL});document.getElementById('result-title').innerText=a>=.6?WELL_DONE:TRY_AGAIN;document.getElementById('result-detail').innerText=`Accuracy: ${Math.round(a*100)}% · ${r.reason}`;document.getElementById('result-panel').classList.remove('hidden');speak(document.getElementById('result-title').innerText,LANG_CODE);let cd=document.getElementById('next-countdown');if(r.new_level>LEVEL&&LEVEL<5){let s=3;cd.innerText=`Next level starts in ${s}…`;let z=setInterval(()=>{s--;cd.innerText=s>0?`Next level starts in ${s}…`:'Starting…';if(s<=0){clearInterval(z);location.href='/game/numbers'}},1000)}else cd.innerText='Practice this level again or return home.'}
</script>{% endblock %}
