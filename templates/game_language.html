{% extends "base.html" %}
{% block content %}<div class="game-shell cognitive-game game-language"><div class="game-topbar"><a href="{{url_for('patient_dashboard')}}" class="back-btn">← Back</a><h1>{{lang.language_game}}</h1><div class="level-badge">Level {{level}}</div></div><div class="game-intro"><span class="game-domain">💬 LANGUAGE</span><p>Find the word that belongs with the others.</p></div><div class="contrast-note"><span class="contrast-dot"></span>Clear colour edges help separate the word choices.</div><div id="word-question" class="quiz-question"></div><div id="word-options" class="quiz-options"></div><div id="progress" class="quiz-progress"></div><div id="result-panel" class="result-panel hidden"><h2 id="result-title"></h2><p id="result-detail"></p><a href="{{url_for('patient_dashboard')}}" class="big-btn primary">Back to Home</a><div id="next-countdown" class="next-countdown"></div></div></div>{% endblock %}
{% block scripts %}<script>
const LEVEL={{level}},LANG_CODE='{{patient.language}}',WELL_DONE='{{lang.well_done}}',TRY_AGAIN='{{lang.try_again}}';
const sets=[['Apple','Banana','Mango','Chair'],['Rose','Lotus','Jasmine','Spoon'],['Dog','Cat','Cow','Book'],['Tea','Coffee','Juice','Pillow'],['Bus','Train','Car','Banana'],['Rice','Bread','Potato','Clock']];
let qs=sets.slice(0,Math.min(6,2+LEVEL)).sort(()=>Math.random()-.5),i=0,correct=0,times=[],started=Date.now();function render(){if(i>=qs.length)return finish();let s=qs[i], answer=s[3];let opts=[...s];document.getElementById('word-question').innerText='Which word does NOT belong?';document.getElementById('progress').innerText=`Question ${i+1} of ${qs.length}`;let b=document.getElementById('word-options');b.innerHTML='';opts.sort(()=>Math.random()-.5).forEach(v=>{let x=document.createElement('button');x.className='quiz-option';x.innerText=v;x.onclick=()=>{times.push(Date.now()-started);if(v===answer)correct++;i++;render()};b.appendChild(x)});started=Date.now()}async function finish(){let a=correct/qs.length,avg=Math.round(times.reduce((x,y)=>x+y,0)/times.length),r=await submitScore({game_type:'language',accuracy:a,avg_time_ms:avg,score:Math.round(a*100),level:LEVEL});document.getElementById('result-title').innerText=a>=.6?WELL_DONE:TRY_AGAIN;document.getElementById('result-detail').innerText=`Accuracy: ${Math.round(a*100)}% · ${r.reason}`;document.getElementById('result-panel').classList.remove('hidden');speak(document.getElementById('result-title').innerText,LANG_CODE);let cd=document.getElementById('next-countdown');if(r.new_level>LEVEL&&LEVEL<5){let s=3;cd.innerText=`Next level starts in ${s}…`;let t=setInterval(()=>{s--;cd.innerText=s>0?`Next level starts in ${s}…`:'Starting…';if(s<=0){clearInterval(t);location.href='/game/language'}},1000)}else cd.innerText='Practice this level again or return home.'}render();
</script>{% endblock %}
